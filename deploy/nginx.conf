# ============================================================
# 财务管家 · Nginx 站点配置模板
#
# 使用方式：
#   1. 把 finance.example.com 换成你的域名
#   2. 证书路径按实际修改（阿里云证书 / certbot）
#   3. 后端端口默认 9081，如不同同步改 proxy_pass
#   4. 放到 /etc/nginx/conf.d/finance.conf，执行 nginx -t && systemctl reload nginx
#
# 约定：前端与后端同域（都走这个 server），因此不需要 CORS。
# ============================================================

# HTTP：只用于跳转 HTTPS（证书续期时也走这里）
server {
    listen 80;
    server_name finance.example.com;

    # 如果还没配 HTTPS，先把本 server 改成静态站点，注释掉 return
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name finance.example.com;

    # ---------- 证书 ----------
    ssl_certificate     /etc/nginx/ssl/finance.pem;
    ssl_certificate_key /etc/nginx/ssl/finance.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---------- 站点根目录 ----------
    # current 是指向 releases/<时间戳> 的软链接，发版/回滚只切它
    root  /var/www/finance/current;
    index index.html;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 如需更严格的 CSP，先确认 ECharts 的 canvas / 内联样式不受影响再启用
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- 静态资源 ----------
    # Vite 产物带内容 hash，可以放心长期缓存
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 入口 HTML 不缓存，保证发版后刷新即生效
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA 路由回退：直接访问 /records、/budget 刷新也能进
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后端反代 ----------
    # 注意末尾的 /api/：必须与后端 server.servlet.context-path: /api 对应
    # 写成 http://127.0.0.1:9081/ 会丢掉 /api 前缀，导致 404
    location /api/ {
        proxy_pass http://127.0.0.1:9081/api/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 导出 Excel 可能稍慢，读超时给到 30s
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        client_max_body_size 2m;
    }
}
